      css: |-
        /* The menu looks like a pop-up: the same backdrop, background and shadow */
        .scrim {
          background: var(--bubble-backdrop-background-color);
        }
        .sheet {
          padding: calc(var(--ha-space-5) + var(--safe-area-inset-top, 0px)) var(--ha-space-5) var(--ha-space-6, 24px) var(--ha-space-5);
          gap: var(--ha-space-5);
          background: var(--popup-background);
          box-shadow: var(--shadow-elevated);
