      media_player:
        album_cover_background: true
        show: '[[[ return !navbar.isDesktop; ]]]'
        players:
        - entity: |-
            [[[
              const speakers = ['media_player.livingroom_ashers_echo_spot_2', 'media_player.kitchen_ashers_white_echo_pop_2', 'media_player.ashersbedroomechodot2', 'media_player.office_echo_dot_2', 'media_player.office_homepod_mini'];
              const find = (state) => speakers.find((id) => states[id]?.state === state && states[id].attributes.media_title);
              const speaker = find('playing') ?? find('paused') ?? speakers[0];
              const leader = states[speaker]?.attributes?.group_members?.[0];
              return states[leader] ? leader : speaker;
            ]]]
          show: |-
            [[[
              const speakers = ['media_player.livingroom_ashers_echo_spot_2', 'media_player.kitchen_ashers_white_echo_pop_2', 'media_player.ashersbedroomechodot2', 'media_player.office_echo_dot_2', 'media_player.office_homepod_mini'];
              const find = (state) => speakers.find((id) => states[id]?.state === state && states[id].attributes.media_title);
              const speaker = find('playing') ?? find('paused');
              // The styles can't read states, so the link on the cover reads this variable
              const grouped = (states[speaker]?.attributes?.group_members?.length ?? 0) > 1;
              document.documentElement.style.setProperty('--navbar-player-group', grouped ? '1' : '0');
              return !!speaker;
            ]]]
          subtitle: |-
            [[[
              const speakers = ['media_player.livingroom_ashers_echo_spot_2', 'media_player.kitchen_ashers_white_echo_pop_2', 'media_player.ashersbedroomechodot2', 'media_player.office_echo_dot_2', 'media_player.office_homepod_mini'];
              const find = (state) => speakers.find((id) => states[id]?.state === state && states[id].attributes.media_title);
              const speaker = states[find('playing') ?? find('paused')];
              const others = (speaker?.attributes?.group_members?.length ?? 1) - 1;
              const leader = states[speaker?.attributes?.group_members?.[0]] ?? speaker;
              return (leader?.attributes?.friendly_name ?? '') + (others > 0 ? ' +' + others : '');
            ]]]
