# Nexus Tablet Origami Dashboard
# For Nexus 7 (2013): 960 x 600 points in landscape, old hardware, so the light build.
# Built by build.py from Origami's parts. Paste it into the dashboard's raw configuration editor,
# as the README in this folder says. The dashboard's URL has to be nexus-tablet-origami-dashboard.
views:
- type: sections
  title: Landscape
  path: landscape
  icon: mdi:tablet
  max_columns: 2
  sections:
  - type: grid
    cards:
    - type: grid
      square: false
      columns: 2
      cards:
      - type: custom:bubble-card
        card_type: separator
        name: '${(h => h < 5 ? ''Still awake?'' : h < 22 ? ''Hello there'' : ''Good night'')(new Date().getHours())}'
        modules:
        - origami_base
        - origami_header
        origami_header:
          value_position: above
          value_size: var(--ha-font-size-s)
          value_max_width: 100px
        sub_button:
          main:
          - entity: calendar.household
            show_icon: false
            origami_header:
              name: ${attr.message}
            tap_action:
              action: none
      - type: custom:origami-notifications
        weather: weather.openweathermap
        hide_when_empty: false
        rotate: 3
        entities:
        - entity: calendar.household
          before: '24:00:00'
        - vacuum.kitchen_eufy_robovac
        - entity: binary_sensor.living_room_front_door_entry_door
          name: Front door
        - entity: binary_sensor.living_room_side_door_entry_door
          name: Side door
        - entity: binary_sensor.kitchen_back_door_entry_door
          name: Back door
        css: |
          :host {
            --origami-pad: var(--ha-space-4);
            --origami-gap: var(--ha-space-4);
            --origami-tile: var(--ha-space-10);
            --origami-row-tile: var(--ha-space-12);
            --origami-icon: var(--icon-size-m);
            --origami-radius: var(--radius-inner);
            --origami-card-bg: var(--fill-subtle);
            --origami-row-bg: var(--fill-subtle);
            --accent-color: var(--fill-active);
            --ha-tile-icon-border-radius: var(--radius-inner);
            --ha-tile-info-primary-font-size: var(--ha-font-size-m);
            --ha-tile-info-primary-font-weight: var(--ha-font-weight-bold);
            --ha-tile-info-secondary-font-size: var(--ha-font-size-s);
            --ha-tile-info-secondary-font-weight: var(--ha-font-weight-medium);
            --ha-tile-info-secondary-color: var(--secondary-text-color);
          }
          ha-card { box-shadow: none; }
          .texts { min-height: calc(var(--origami-tile) + 2 * var(--origami-pad)); }
          .slide { gap: var(--ha-space-1); }
          .icon {
            background: color-mix(in srgb, var(--tile-color) var(--tint-strength), var(--ha-card-background, var(--card-background-color)));
            box-shadow: var(--ha-card-box-shadow, none);
          }
          .head .icon.idle { color: var(--primary-text-color); }
          .badge {
            top: -6px;
            inset-inline-end: -6px;
            min-width: 20px;
            height: 20px;
            padding: 0 6px 0 6px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: var(--ha-font-weight-bold);
            box-shadow: none;
          }
          .list { gap: var(--ha-space-2); }
          .row { padding: var(--ha-space-3); }
          .row .title {
            font-size: var(--ha-font-size-m);
            font-weight: var(--ha-font-weight-bold);
          }
          .row .message { font-size: var(--ha-font-size-s); }
          .heading {
            font-weight: var(--ha-font-weight-bold);
            font-size: var(--ha-font-size-l);
          }
    - type: custom:origami-weather
      weather_entity: weather.openweathermap
      color_mode: theme
      card_height: content
      card_padding: 20px 20px 20px 20px
      card_offset: 20px 0px 0px 0px
      card_tap_action:
        action: more-info
      sun_enabled: false
      moon_enabled: false
      cloud_effects: false
      precipitation_effects: false
      night_sky_effects: false
      bird_effects: false
      plane_effects: false
      balloon_effects: false
      background_haze: false
      background_mode: color
      background_color: '#e6e3de'
      background_color_dark: rgba(28, 27, 25, 0.7)
      background_threshold_entity: weather.openweathermap
      background_thresholds:
      - value: sunny
        color: '#eee5d7'
        color_dark: '#261d13'
      - value: clear-night
        color: '#e0e3ed'
        color_dark: '#161924'
      - value: partlycloudy
        color: '#dee9ef'
        color_dark: '#182227'
      - value: cloudy
        color: '#e2e5e7'
        color_dark: '#1b1e20'
      - value: fog
        color: '#e8e7e5'
        color_dark: '#222120'
      - value: windy
        color: '#dce6e3'
        color_dark: '#182220'
      - value: windy-variant
        color: '#dae1de'
        color_dark: '#171d1b'
      - value: rainy
        color: '#d9e1ea'
        color_dark: '#171e26'
      - value: pouring
        color: '#d7dde4'
        color_dark: '#151b21'
      - value: lightning
        color: '#e5dfe8'
        color_dark: '#221d25'
      - value: lightning-rainy
        color: '#dfdbe2'
        color_dark: '#1d1920'
      - value: hail
        color: '#d3dfdf'
        color_dark: '#121c1c'
      - value: snowy
        color: '#e5eaec'
        color_dark: '#1c2426'
      - value: snowy-rainy
        color: '#dde2e5'
        color_dark: '#1e2124'
      - value: exceptional
        color: '#eadad3'
        color_dark: '#271a15'
      grid_options:
        columns: full
        rows: auto
      css: |
        /* Origami Weather with the Origami theme's values */
        :host {
          --origami-text-light: var(--primary-text-color);
          --origami-text-dark: var(--primary-text-color);
          --origami-bottom-font-weight: var(--ha-font-weight-normal);
          --origami-bottom-bg-filter: var(--blur-soft);
        }

        /* The card's color changes softly with the weather */
        @media (prefers-reduced-motion: no-preference) {
          #card-root.bg-custom-color.bg-custom-color { transition: background-color 1.2s var(--ease-standard), transform .4s cubic-bezier(.2, 0, .2, 1); }
        }

        /* On a wide screen, the heading above the card sets the space */
        @media (min-width: 768px) { :host { margin: 0px 0px 0px 0px !important; } }
      button_containers:
      - buttons:
        - entity: weather.openweathermap
          background: false
          padding: 0px 0px 0px 0px
          style: vertical
          align: start
          inner_gap: 6px
          elements:
          - type: text
            text: Outside
            size: 14px
            weight: '500'
          - type: text
            attribute: temperature
            precision: 0
            format: °
            size: 42px
            weight: '700'
      - position: custom
        position_anchor: top-right
        layout: horizontal-scroll
        custom_width: 60%
        scroll_count: 3
        gap: 8px
        background: true
        button_style: vertical
        button_padding: 16px 8px 16px 8px
        button_icon_size: 26px
        button_icon_padding: 0px 0px 8px 0px
        button_background_color: color-mix(in srgb, var(--tile-chip-background) 45%, transparent)
        button_blurred_background: false
        buttons:
        - entity: weather.openweathermap
          forecast: daily
          align: center
          elements:
          - type: icon
            icon: weather
          - type: text
            attribute: datetime
            size: 12px
            weight: '500'
            color: var(--secondary-text-color)
          - type: text
            attribute: temperature
            precision: 0
            format: °
            weight: '700'
        - entity: weather.openweathermap
          forecast: daily
          forecast_offset: 1
          align: center
          elements:
          - type: icon
            icon: weather
          - type: text
            attribute: datetime
            size: 12px
            weight: '500'
            color: var(--secondary-text-color)
          - type: text
            attribute: temperature
            precision: 0
            format: °
            weight: '700'
        - entity: weather.openweathermap
          forecast: daily
          forecast_offset: 2
          align: center
          elements:
          - type: icon
            icon: weather
          - type: text
            attribute: datetime
            size: 12px
            weight: '500'
            color: var(--secondary-text-color)
          - type: text
            attribute: temperature
            precision: 0
            format: °
            weight: '700'
        - entity: weather.openweathermap
          forecast: daily
          forecast_offset: 3
          align: center
          elements:
          - type: icon
            icon: weather
          - type: text
            attribute: datetime
            size: 12px
            weight: '500'
            color: var(--secondary-text-color)
          - type: text
            attribute: temperature
            precision: 0
            format: °
            weight: '700'
      - padding: 0px 0px 0px 0px
        margin: 66px 0px 8px 0px
        buttons:
        - entity: weather.openweathermap
          forecast: daily
          background: false
          padding: 0px 0px 0px 0px
          width: 100%
          elements:
          - type: bar
            bar_min: '14'
            bar_max: '95'
            bar_height: 2px
            bar_color: var(--fill-strong)
            bar_marker_size: 10px
            bar_values:
            - entity: weather.openweathermap
              attribute: temperature
              marker_color: var(--primary-text-color)
            - attribute: temperature
      - padding: 0px 4px 0px 4px
        margin: 12px 0px 0px 0px
        align: start
        button_text_size: 16px
        buttons:
        - entity: weather.openweathermap
          background: false
          padding: 0px 0px 0px 0px
          align: spread
          elements:
          - type: icon
            icon: weather
            padding: 0px 4px 0px 0px
          - type: text
            weight: '700'
            margin: 0px auto 0px 0px
        - entity: weather.openweathermap
          forecast: daily
          background: false
          padding: 0px 0px 0px 0px
          align: spread
          elements:
          - type: icon
            icon: mdi:umbrella-outline
            margin: 0px 0px 0px auto
          - type: text
            attribute: precipitation_probability
            format: ' %'
            weight: '400'
    - type: custom:bubble-card
      card_type: separator
      name: Favorites
      modules:
      - origami_base
      - origami_header
      origami_header:
        weight: medium
        icon_size: var(--icon-size-m)
      grid_options:
        columns: full
        rows: auto
      sub_button:
        main:
        - name: All
          icon: mdi:chevron-right
          show_name: true
          content_layout: icon-right
          tap_action:
            action: navigate
            navigation_path: '#popup_favorites'
    - type: custom:bubble-card
      card_type: sub-buttons
      modules:
      - origami_base
      - origami_tiles
      origami_tiles:
        scroll: true
      grid_options:
        columns: full
        rows: auto
      sub_button:
        bottom:
        - name: Living room
          entity: media_player.livingroom_ashers_echo_spot_2
          icon: mdi:speaker
          force_icon: true
          origami_tiles:
            color: var(--state-media_player-active-color)
            image: ${attr.entity_picture}
          visibility:
          - condition: state
            entity: media_player.livingroom_ashers_echo_spot_2
            state: playing
          tap_action:
            action: navigate
            navigation_path: '#popup_music'
          hold_action:
            action: more-info
        - name: Kitchen
          entity: media_player.kitchen_ashers_white_echo_pop_2
          icon: mdi:speaker
          force_icon: true
          origami_tiles:
            color: var(--state-media_player-active-color)
            image: ${attr.entity_picture}
          visibility:
          - condition: state
            entity: media_player.kitchen_ashers_white_echo_pop_2
            state: playing
          tap_action:
            action: navigate
            navigation_path: '#popup_music'
          hold_action:
            action: more-info
        - name: Bedroom
          entity: media_player.ashersbedroomechodot2
          icon: mdi:speaker
          force_icon: true
          origami_tiles:
            color: var(--state-media_player-active-color)
            image: ${attr.entity_picture}
          visibility:
          - condition: state
            entity: media_player.ashersbedroomechodot2
            state: playing
          tap_action:
            action: navigate
            navigation_path: '#popup_music'
          hold_action:
            action: more-info
        - name: Office
          entity: media_player.office_echo_dot_2
          icon: mdi:speaker
          force_icon: true
          origami_tiles:
            color: var(--state-media_player-active-color)
            image: ${attr.entity_picture}
          visibility:
          - condition: state
            entity: media_player.office_echo_dot_2
            state: playing
          tap_action:
            action: navigate
            navigation_path: '#popup_music'
          hold_action:
            action: more-info
        - name: HomePod
          entity: media_player.office_homepod_mini
          icon: mdi:speaker
          force_icon: true
          origami_tiles:
            color: var(--state-media_player-active-color)
            image: ${attr.entity_picture}
          visibility:
          - condition: state
            entity: media_player.office_homepod_mini
            state: playing
          tap_action:
            action: navigate
            navigation_path: '#popup_music'
          hold_action:
            action: more-info
        - name: Shopping
          entity: todo.shopping_list
          icon: mdi:cart-outline
          origami_tiles:
            name: '${num(state, 0)} ${Number(state) === 1 ? ''item'' : ''items''}'
            state: To buy
          visibility:
          - condition: numeric_state
            entity: todo.shopping_list
            above: 0
          tap_action:
            action: navigate
            navigation_path: /todo?entity_id=todo.shopping_list
          hold_action:
            action: more-info
        - name: TV
          entity: media_player.living_room_55_tcl_roku_tv
          icon: mdi:television
          visibility:
          - condition: state
            entity: media_player.living_room_55_tcl_roku_tv
            state_not:
            - 'off'
            - standby
            - unavailable
            - unknown
          tap_action:
            action: navigate
            navigation_path: '#popup_tv'
          hold_action:
            action: more-info
        - name: Vacuum
          entity: vacuum.kitchen_eufy_robovac
          icon: mdi:robot-vacuum
          force_icon: true
          origami_tiles:
            state:
              docked: ${word('off')}
              idle: ${word('off')}
              cleaning: Vacuum
            order:
              cleaning: -1
          tap_action:
            action: navigate
            navigation_path: '#popup_vacuum'
          hold_action:
            action: more-info
  - type: grid
    cards:
    - type: custom:bubble-card
      card_type: separator
      name: Rooms
      modules:
      - origami_base
      - origami_header
      origami_header:
        weight: medium
        value_style: chip
        icon_size: var(--icon-size-l)
      grid_options:
        columns: full
        rows: auto
      sub_button:
        main:
        - name: Temperature
          icon: mdi:thermometer
          origami_header:
            name: '${(t => t.length ? num(t.reduce((a, b) => a + b, 0) / t.length, 0) + ''°'' : ''–'')( [''sensor.living_room_temp_3_snzb_02p_sonoff_a440047919_temperature'', ''sensor.temperature_1_snzb_02p_sonoff_a440047912_temperature'', ''sensor.temp_2_snzb_02p_sonoff_a440047917_temperature'', ''sensor.office_echo_dot_temperature''] .map((id) => parseFloat(states(id))).filter((v) => !isNaN(v)))}'
          tap_action:
            action: perform-action
            perform_action: input_boolean.toggle
            target:
              entity_id: input_boolean.room_climate_card
        - name: Windows
          icon: mdi:window-closed-variant
          origami_header:
            name: ${['binary_sensor.couch_window_sensor_snzb_04pr2_sonoff_a4400479b6', 'binary_sensor.front_door_window_sensor_snzb_04pr2_sonoff_a4400479af', 'binary_sensor.stairs_window_sensor_snzb_04pr2_sonoff_a4400479b5', 'binary_sensor.typewriter_window_sensor_snzb_04pr2_sonoff_a4400479b3'] .filter((id) => states(id) === 'on').length}
            icon: '${[''binary_sensor.couch_window_sensor_snzb_04pr2_sonoff_a4400479b6'', ''binary_sensor.front_door_window_sensor_snzb_04pr2_sonoff_a4400479af'', ''binary_sensor.stairs_window_sensor_snzb_04pr2_sonoff_a4400479b5'', ''binary_sensor.typewriter_window_sensor_snzb_04pr2_sonoff_a4400479b3''] .some((id) => states(id) === ''on'') ? ''mdi:window-open-variant'' : ''''}'
            color: '${[''binary_sensor.couch_window_sensor_snzb_04pr2_sonoff_a4400479b6'', ''binary_sensor.front_door_window_sensor_snzb_04pr2_sonoff_a4400479af'', ''binary_sensor.stairs_window_sensor_snzb_04pr2_sonoff_a4400479b5'', ''binary_sensor.typewriter_window_sensor_snzb_04pr2_sonoff_a4400479b3''] .some((id) => states(id) === ''on'') ? ''var(--state-binary_sensor-window-on-color)'' : ''var(--secondary-text-color)''}'
            background: '${[''binary_sensor.couch_window_sensor_snzb_04pr2_sonoff_a4400479b6'', ''binary_sensor.front_door_window_sensor_snzb_04pr2_sonoff_a4400479af'', ''binary_sensor.stairs_window_sensor_snzb_04pr2_sonoff_a4400479b5'', ''binary_sensor.typewriter_window_sensor_snzb_04pr2_sonoff_a4400479b3''] .some((id) => states(id) === ''on'') ? ''var(--tint)'' : ''''}'
          tap_action:
            action: perform-action
            perform_action: input_boolean.toggle
            target:
              entity_id: input_boolean.room_climate_card
        - name: Climate table
          entity: input_boolean.room_climate_card
          icon: mdi:chevron-down
          show_background: false
          origami_header:
            icon:
              'on': mdi:chevron-up
          tap_action:
            action: toggle
    - type: custom:bubble-card
      card_type: sub-buttons
      modules:
      - origami_base
      - origami_table
      origami_table:
        columns:
        - name: room
          icon: mdi:circle
          color_template: '${(t => [[12, ''#728FA8B3''], [15, ''#7C97A9B3''], [17, ''#8BA2A8B3''], [18.5, ''#9AAEA3B3''], [22, ''#88A37EB3''], [24, ''#99A677B3''], [25, ''#AEA76FB3''], [26, ''#BB9F68B3''], [27, ''#C0935FB3''], [28, ''#BF8A5FB3''], [29, ''#BB7E5DB3''], [30.5, ''#B3735CB3''], [32, ''#AA6A5AB3''], [Infinity, ''#9C6056B3'']] .find(([top]) => t <= top)?.[1] ?? ''transparent'') (hass.config.unit_system.temperature === ''°F'' ? (state - 32) / 1.8 : parseFloat(state))}'
        - name: temperature
          width: 1fr
          align: end
          icon: mdi:thermometer
          text_template: ${num(state, 0)}°
          icon_template: '${(t => +state === Math.max(...t) && +state > Math.min(...t) ? ''mdi:arrow-up'' : +state === Math.min(...t) && +state < Math.max(...t) ? ''mdi:arrow-down'' : '''')( [''sensor.living_room_temp_3_snzb_02p_sonoff_a440047919_temperature'', ''sensor.temperature_1_snzb_02p_sonoff_a440047912_temperature'', ''sensor.temp_2_snzb_02p_sonoff_a440047917_temperature'', ''sensor.office_echo_dot_temperature''] .map((id) => parseFloat(states(id))).filter((v) => !isNaN(v)))}'
          color_template: '${(t => +state === Math.min(...t) && +state < Math.max(...t) ? ''var(--secondary-text-color)'' : '''')( [''sensor.living_room_temp_3_snzb_02p_sonoff_a440047919_temperature'', ''sensor.temperature_1_snzb_02p_sonoff_a440047912_temperature'', ''sensor.temp_2_snzb_02p_sonoff_a440047917_temperature'', ''sensor.office_echo_dot_temperature''] .map((id) => parseFloat(states(id))).filter((v) => !isNaN(v)))}'
          'on': ${(t => +state === Math.max(...t) && +state > Math.min(...t))( ['sensor.living_room_temp_3_snzb_02p_sonoff_a440047919_temperature', 'sensor.temperature_1_snzb_02p_sonoff_a440047912_temperature', 'sensor.temp_2_snzb_02p_sonoff_a440047917_temperature', 'sensor.office_echo_dot_temperature'] .map((id) => parseFloat(states(id))).filter((v) => !isNaN(v)))}
        - name: humidity
          icon: mdi:water-percent
          text_template: ${num(state, 0, '%')}
          icon_template: '${(t => +state === Math.max(...t) && +state > Math.min(...t) ? ''mdi:arrow-up'' : +state === Math.min(...t) && +state < Math.max(...t) ? ''mdi:arrow-down'' : '''')( [''sensor.living_room_temp_3_snzb_02p_sonoff_a440047919_humidity'', ''sensor.temperature_1_snzb_02p_sonoff_a440047912_humidity'', ''sensor.temp_2_snzb_02p_sonoff_a440047917_humidity''] .map((id) => parseFloat(states(id))).filter((v) => !isNaN(v)))}'
          color_template: '${(t => +state === Math.min(...t) && +state < Math.max(...t) ? ''var(--secondary-text-color)'' : '''')( [''sensor.living_room_temp_3_snzb_02p_sonoff_a440047919_humidity'', ''sensor.temperature_1_snzb_02p_sonoff_a440047912_humidity'', ''sensor.temp_2_snzb_02p_sonoff_a440047917_humidity''] .map((id) => parseFloat(states(id))).filter((v) => !isNaN(v)))}'
          'on': ${(t => +state === Math.max(...t) && +state > Math.min(...t))( ['sensor.living_room_temp_3_snzb_02p_sonoff_a440047919_humidity', 'sensor.temperature_1_snzb_02p_sonoff_a440047912_humidity', 'sensor.temp_2_snzb_02p_sonoff_a440047917_humidity'] .map((id) => parseFloat(states(id))).filter((v) => !isNaN(v)))}
      grid_options:
        columns: full
        rows: auto
      styles: |-
        ha-card {
          margin-bottom: var(--ha-space-5);
        }
      sub_button:
        bottom_layout: rows
        main: []
        bottom:
        - name: Living room
          group:
          - entity: sensor.living_room_temp_3_snzb_02p_sonoff_a440047919_temperature
            name: Living
            show_name: true
            css_class: room
          - entity: sensor.living_room_temp_3_snzb_02p_sonoff_a440047919_temperature
            css_class: temperature
          - entity: sensor.living_room_temp_3_snzb_02p_sonoff_a440047919_humidity
            css_class: humidity
        - name: Kitchen
          group:
          - entity: sensor.temperature_1_snzb_02p_sonoff_a440047912_temperature
            name: Kitchen
            show_name: true
            css_class: room
          - entity: sensor.temperature_1_snzb_02p_sonoff_a440047912_temperature
            css_class: temperature
          - entity: sensor.temperature_1_snzb_02p_sonoff_a440047912_humidity
            css_class: humidity
        - name: Bedroom
          group:
          - entity: sensor.temp_2_snzb_02p_sonoff_a440047917_temperature
            name: Bed
            show_name: true
            css_class: room
          - entity: sensor.temp_2_snzb_02p_sonoff_a440047917_temperature
            css_class: temperature
          - entity: sensor.temp_2_snzb_02p_sonoff_a440047917_humidity
            css_class: humidity
        - name: Office
          group:
          - entity: sensor.office_echo_dot_temperature
            name: Office
            show_name: true
            css_class: room
          - entity: sensor.office_echo_dot_temperature
            css_class: temperature
      visibility:
      - condition: state
        entity: input_boolean.room_climate_card
        state: 'on'
    - type: custom:bubble-card
